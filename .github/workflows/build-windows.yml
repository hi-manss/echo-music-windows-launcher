name: Build Echo Music Windows Launcher

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches: [main]
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.upstream.outputs.tag }}
      should_build: ${{ steps.release_check.outputs.is_new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest upstream release
        id: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = Invoke-RestMethod -Headers @{ "User-Agent" = "EchoMusicWindowsLauncher"; "Authorization" = "Bearer $env:GH_TOKEN"; "Accept" = "application/vnd.github+json" } -Uri "https://api.github.com/repos/EchoMusicApp/Echo-Music/releases/latest"
          $tag = [string]$release.tag_name
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Could not read latest upstream release tag." }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Latest upstream release: $tag"

      - name: Skip if this release was already built
        id: release_check
        shell: pwsh
        run: |
          $tag = "${{ steps.upstream.outputs.tag }}"
          $previous = if (Test-Path ".last-upstream-release") { (Get-Content ".last-upstream-release" -Raw).Trim() } else { "" }
          $isNew = ($tag -ne $previous)
          "is_new=$($isNew.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release=$tag Previous=$previous New=$isNew"

      - name: Install .NET SDK
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file Windows executable
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: pwsh
        run: dotnet publish EchoMusicLauncher.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload raw EXE artifact (no ZIP)
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          path: publish/EchoMusicLauncher.exe
          archive: false
          retention-days: 30

      - name: Prepare package payload
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish/EchoMusicLauncher.exe package/EchoMusicLauncher.exe
          @(
            "Echo Music Windows Launcher",
            "Version: ${{ steps.upstream.outputs.tag }}",
            "",
            "This launcher self-provisions official Android SDK components on first run.",
            "It runs the Echo Music Android APK inside a landscape tablet emulator; it is not a native Windows desktop port.",
            "Internet access, free disk space, and hardware virtualization are required for first-run setup."
          ) | Set-Content package/README.txt

      - name: Log in to GitHub Container Registry
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create package image and publish to GitHub Packages
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: pwsh
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          @"
          FROM scratch
          LABEL org.opencontainers.image.title="Echo Music Windows Launcher"
          LABEL org.opencontainers.image.version="$env:UPSTREAM_TAG"
          LABEL org.opencontainers.image.source="https://github.com/$env:GHCR_OWNER/echo-music-windows-launcher"
          COPY EchoMusicLauncher.exe /EchoMusicLauncher.exe
          COPY README.txt /README.txt
          "@ | Set-Content -Encoding ascii package/Dockerfile
          $image = "ghcr.io/$($env:GHCR_OWNER.ToLower())/echo-music-windows-launcher"
          docker build -f package/Dockerfile -t "$image`:$env:UPSTREAM_TAG" package
          docker push "$image`:$env:UPSTREAM_TAG"
          docker tag "$image`:$env:UPSTREAM_TAG" "$image`:latest"
          docker push "$image`:latest"

      - name: Record latest upstream release
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: pwsh
        run: |
          Set-Content -Path ".last-upstream-release" -Value "${{ steps.upstream.outputs.tag }}" -NoNewline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-upstream-release
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record Echo Music release ${{ steps.upstream.outputs.tag }}"
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "Could not rebase the release marker commit onto main." }
            git push
            if ($LASTEXITCODE -ne 0) { throw "Could not push the release marker update." }
          } else {
            Write-Host "Release marker unchanged; no Git push needed."
          }

  publish-direct-exe:
    needs: build
    if: needs.build.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download raw EXE artifact
        uses: actions/download-artifact@v8
        with:
          name: EchoMusicLauncher.exe
          path: publish

      - name: Authenticode-sign EXE when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -and [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            Write-Warning "No code-signing certificate configured. Publishing unsigned EXE; SmartScreen may warn about an unrecognized app."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw "Both WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD secrets are required to sign the executable."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "echo-music-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
            $kitPath = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)) "Windows Kits/10/bin"
            $signtool = Get-ChildItem -Path $kitPath -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\\\x64\\\\signtool\\.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signtool) { throw "Windows SDK SignTool was not found on the runner." }
            & $signtool.FullName sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD "publish/EchoMusicLauncher.exe"
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
            & $signtool.FullName verify /pa /v "publish/EchoMusicLauncher.exe"
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed." }
          } finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Publish standalone EXE to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
        run: |
          $releaseTag = "launcher-$env:UPSTREAM_TAG"
          $repo = "${{ github.repository }}"
          $headers = @{ "User-Agent" = "EchoMusicWindowsLauncher"; "Authorization" = "Bearer $env:GH_TOKEN"; "Accept" = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $uri = "https://api.github.com/repos/$repo/releases/tags/$([uri]::EscapeDataString($releaseTag))"
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Headers $headers -Uri $uri -ErrorAction Stop
          } catch {
            $statusCode = 0
            try { $statusCode = [int]$_.Exception.Response.StatusCode } catch { }
            if ($statusCode -ne 404) { throw }
          }
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @(
            "Windows launcher build for upstream Echo Music $env:UPSTREAM_TAG.",
            "",
            "Download EchoMusicLauncher.exe below. It bootstraps an Android tablet emulator on first run and requires internet access, disk space, and CPU virtualization.",
            "",
            "This is an Android emulator launcher, not a native Windows port. If the file is unsigned, Windows SmartScreen may show an unknown-app warning."
          ) | Set-Content $notes
          if ($null -eq $existing) {
            gh release create $releaseTag "publish/EchoMusicLauncher.exe" --repo $repo --title "Echo Music Windows Launcher $env:UPSTREAM_TAG" --notes-file $notes
          } else {
            gh release upload $releaseTag "publish/EchoMusicLauncher.exe" --repo $repo --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the standalone EXE release asset failed." }
