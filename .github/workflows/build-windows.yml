name: Build Echo Music Windows Launcher

on:
  workflow_dispatch:
  schedule:
    # Poll upstream once per day.
    - cron: "30 3 * * *"
  push:
    branches: [main]
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest upstream release
        id: upstream
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Headers @{ "User-Agent" = "EchoMusicWindowsLauncher" } -Uri "https://api.github.com/repos/EchoMusicApp/Echo-Music/releases/latest"
          $tag = [string]$release.tag_name
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Could not read the latest upstream release tag."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Latest upstream release: $tag"

      - name: Skip if this release was already built
        id: release_check
        shell: pwsh
        run: |
          $tag = "${{ steps.upstream.outputs.tag }}"
          $marker = ".last-upstream-release"
          $previous = ""
          if (Test-Path $marker) {
            $previous = (Get-Content $marker -Raw).Trim()
          }
          $isNew = ($tag -ne $previous)
          "is_new=$($isNew.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($isNew) {
            Write-Host "New upstream release detected: $tag"
          } else {
            Write-Host "Release $tag has already been built."
          }

      - name: Install .NET SDK
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file Windows executable
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: pwsh
        run: dotnet publish EchoMusicLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload executable
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: EchoMusicLauncher-Windows-x64-${{ steps.upstream.outputs.tag }}
          path: publish/EchoMusicLauncher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Record latest upstream release
        if: steps.release_check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: pwsh
        run: |
          Set-Content -Path ".last-upstream-release" -Value "${{ steps.upstream.outputs.tag }}" -NoNewline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-upstream-release
          git commit -m "Record Echo Music release ${{ steps.upstream.outputs.tag }}" || Write-Host "Release marker unchanged"
          git push
